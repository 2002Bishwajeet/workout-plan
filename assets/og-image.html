<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROTOCOL OG image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#FFF8F5;}
  /* capture stage: scale the 1200×630 art to fit the ~924px preview, recapture sharp at 2x */
  .stage{width:924px;height:485px;overflow:hidden;}
  .stage .og{transform:scale(0.77);transform-origin:top left;}
  .og{width:1200px;height:630px;background:#FFF8F5;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:72px 80px;box-sizing:border-box;}
  /* top row: app-icon tile + sub */
  .top{display:flex;align-items:center;gap:28px;}
  .tile{width:96px;height:96px;border-radius:24px;background:#A23F16;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 4px 8px 3px rgba(60,30,12,0.12),0 1px 3px rgba(60,30,12,0.30);}
  .tile .p{font-family:'Anton',sans-serif;font-size:64px;color:#fff;transform:translateY(2px);}
  .tile .d{position:absolute;right:20px;bottom:28px;width:9px;height:9px;border-radius:50%;background:#F8E2A6;}
  .sub{font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:0.18em;text-transform:uppercase;color:#53433B;white-space:nowrap;}
  /* wordmark */
  .mark{font-family:'Anton',sans-serif;font-size:150px;line-height:0.86;text-transform:uppercase;color:#221A15;letter-spacing:0.005em;white-space:nowrap;}
  .mark span{color:#A23F16;}
  /* footer line of chips */
  .chips{display:flex;gap:14px;align-items:center;}
  .chip{height:46px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.04em;}
  .chip.solid{background:#FFDBCB;color:#3A0B00;}
  .chip.line{background:#FCEBE4;color:#53433B;}
  .glow{position:absolute;width:680px;height:680px;border-radius:50%;right:-220px;top:-260px;background:radial-gradient(circle,rgba(162,63,22,0.10),transparent 68%);}
</style>
</head>
<body>
  <div class="stage">
  <div class="og">
    <div class="glow"></div>
    <div class="top">
      <div class="tile"><span class="p">P</span><span class="d"></span></div>
      <div class="sub">Bishwajeet // 12-wk PPL</div>
    </div>
    <div class="mark">PROTO<span>·</span>COL</div>
    <div class="chips">
      <span class="chip solid">12-week PPL</span>
      <span class="chip line">RPE-driven</span>
      <span class="chip line">Git-backed training log</span>
    </div>
  </div>
  </div>
</body>
</html>
