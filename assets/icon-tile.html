<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PROTOCOL icon tile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;}
  /* 512×512 maskable app-icon tile, Material You primary */
  .tile{width:512px;height:512px;background:#A23F16;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .glyph{font-family:'Anton',sans-serif;font-size:330px;line-height:1;color:#FFFFFF;letter-spacing:0;transform:translateY(8px);}
  .dot{position:absolute;right:104px;bottom:150px;width:46px;height:46px;border-radius:50%;background:#F8E2A6;}
</style>
</head>
<body>
  <div class="tile">
    <span class="glyph">P</span>
    <span class="dot"></span>
  </div>
</body>
</html>
